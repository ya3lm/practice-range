behaviors:
  DodgeMid:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 3000000
    time_horizon: 128
    summary_freq: 10000
environment_parameters:
  # Curriculum: the synthetic player gets better as the policy learns. Measured on cumulative reward.
  aim_noise_deg:
    curriculum:
      - name: sloppy
        completion_criteria: { measure: reward, behavior: DodgeMid, signal_smoothing: true, min_lesson_length: 100, threshold: 1.5 }
        value: 5.0
      - name: average
        completion_criteria: { measure: reward, behavior: DodgeMid, signal_smoothing: true, min_lesson_length: 100, threshold: 1.5 }
        value: 2.5
      - name: sharp
        value: 1.2
  reaction_ms:
    curriculum:
      - name: slow
        completion_criteria: { measure: reward, behavior: DodgeMid, signal_smoothing: true, min_lesson_length: 100, threshold: 1.5 }
        value: 320.0
      - name: average
        completion_criteria: { measure: reward, behavior: DodgeMid, signal_smoothing: true, min_lesson_length: 100, threshold: 1.5 }
        value: 220.0
      - name: fast
        value: 160.0
  fire_interval:
    sampler_type: uniform
    sampler_parameters: { min_value: 0.20, max_value: 0.45 }
engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
checkpoint_settings:
  run_id: DodgeMid
torch_settings:
  device: cpu
